apiVersion: syntheticmonitoring.ext.grafana.app/v1alpha1
kind: Check
metadata:
  name: checkout-browser-flow-1007
spec:
  job: checkout-browser-flow
  target: https://shop.example.com/cart
  frequency: 300000
  timeout: 60000
  enabled: true
  labels:
    - name: team
      value: commerce
  probes:
    - Atlanta
  alertSensitivity: none
  basicMetricsOnly: false
  settings:
    browser:
      script: |
        // Generated by synthetic-monitoring-checks (https://github.com/grafana/skills) on 2026-08-01T09:05:00Z
        import { browser } from 'k6/browser';
        import { expect } from 'https://jslib.k6.io/k6-testing/0.6.1/index.js';

        export const options = {
          scenarios: { ui: { executor: 'shared-iterations', options: { browser: { type: 'chromium' } } } },
        };

        export default async function () {
          const page = await browser.newPage();
          try {
            await page.goto('https://shop.example.com/cart', { waitUntil: 'load' });
            await page.locator('[data-testid="checkout-submit"]').click();
            await expect(page.getByText('Order confirmed')).toBeVisible();
          } finally {
            await page.close();
          }
        }
