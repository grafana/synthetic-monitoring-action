apiVersion: syntheticmonitoring.ext.grafana.app/v1alpha1
kind: Check
metadata:
  name: dns-www-1003
spec:
  job: dns-www
  target: www.example.com
  # Tightened from 120000ms (live) to 60000ms — this is the one intentional change in
  # this fixture set, to exercise the sync plan's "update" path.
  frequency: 60000
  timeout: 5000
  enabled: true
  labels:
    - name: team
      value: platform
  probes:
    - Frankfurt
  alertSensitivity: none
  basicMetricsOnly: true
  settings:
    dns:
      server: ns1.example.com
      recordType: A
      validRCodes: [NOERROR]
