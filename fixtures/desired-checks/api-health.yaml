apiVersion: syntheticmonitoring.ext.grafana.app/v1alpha1
kind: Check
metadata:
  name: api-health-1001
spec:
  job: api-health
  target: https://api.example.com/health
  frequency: 60000
  timeout: 5000
  enabled: true
  labels:
    - name: team
      value: platform
  probes:
    - Atlanta
    - Frankfurt
  alertSensitivity: low
  basicMetricsOnly: true
  settings:
    http:
      method: GET
      validStatusCodes: [200]
      failIfNotSSL: true
