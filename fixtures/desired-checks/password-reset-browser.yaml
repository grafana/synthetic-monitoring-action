apiVersion: syntheticmonitoring.ext.grafana.app/v1alpha1
kind: Check
metadata:
  name: password-reset-browser
spec:
  job: password-reset-browser
  target: https://shop.example.com/forgot-password
  frequency: 600000
  timeout: 120000
  enabled: true
  labels:
    - name: team
      value: commerce
  probes:
    - Atlanta
  alertSensitivity: none
  basicMetricsOnly: false
  settings:
    browser:
      script: |
        // New check: not present in the live account yet (not pulled from gcx).
        import { browser } from 'k6/browser';
        import { expect } from 'https://jslib.k6.io/k6-testing/0.6.1/index.js';

        export const options = {
          scenarios: { ui: { executor: 'shared-iterations', options: { browser: { type: 'chromium' } } } },
        };

        export default async function () {
          const page = await browser.newPage();
          try {
            await page.goto('https://shop.example.com/forgot-password');
            await page.getByLabel('Email').fill('sm-monitor@example.com');
            await page.getByRole('button', { name: 'Send reset link' }).click();
            await expect(page.getByText('Check your email')).toBeVisible();
          } finally {
            await page.close();
          }
        }
