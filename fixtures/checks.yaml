# Representative snapshot of `gcx synthetic-monitoring checks list -o yaml` output,
# used for this POC because the connected stack has no checks yet. Covers the check
# type spread a real fleet would have: protocol checks with no script (http, ping,
# dns, tcp), a MultiHTTP sequence, a k6 scripted API flow, and two k6 browser flows.

# --- Protocol checks: no script, cheapest tier, "simplest sufficient type" ---

- apiVersion: syntheticmonitoring.ext.grafana.app/v1alpha1
  kind: Check
  metadata:
    name: api-health-1001
  spec:
    job: api-health
    target: https://api.example.com/health
    frequency: 60000
    timeout: 5000
    enabled: true
    labels:
      - name: team
        value: platform
    probes:
      - Atlanta
      - Frankfurt
    alertSensitivity: low
    basicMetricsOnly: true
    settings:
      http:
        method: GET
        validStatusCodes: [200]
        failIfNotSSL: true

- apiVersion: syntheticmonitoring.ext.grafana.app/v1alpha1
  kind: Check
  metadata:
    name: edge-ping-1002
  spec:
    job: edge-ping
    target: edge.example.com
    frequency: 60000
    timeout: 3000
    enabled: true
    labels:
      - name: team
        value: platform
    probes:
      - Atlanta
    alertSensitivity: none
    basicMetricsOnly: true
    settings:
      ping: {}

- apiVersion: syntheticmonitoring.ext.grafana.app/v1alpha1
  kind: Check
  metadata:
    name: dns-www-1003
  spec:
    job: dns-www
    target: www.example.com
    frequency: 120000
    timeout: 5000
    enabled: true
    labels:
      - name: team
        value: platform
    probes:
      - Frankfurt
    alertSensitivity: none
    basicMetricsOnly: true
    settings:
      dns:
        server: ns1.example.com
        recordType: A
        validRCodes: [NOERROR]

- apiVersion: syntheticmonitoring.ext.grafana.app/v1alpha1
  kind: Check
  metadata:
    name: mail-tls-1004
  spec:
    job: mail-tls
    target: mail.example.com:465
    frequency: 300000
    timeout: 5000
    enabled: true
    labels:
      - name: team
        value: infra
    probes:
      - Frankfurt
    alertSensitivity: high
    basicMetricsOnly: false
    settings:
      tcp:
        tls: true

# --- MultiHTTP: a request sequence with value-passing, no custom logic ---

- apiVersion: syntheticmonitoring.ext.grafana.app/v1alpha1
  kind: Check
  metadata:
    name: auth-api-flow-1005
  spec:
    job: auth-api-flow
    target: https://api.example.com/auth/login
    frequency: 120000
    timeout: 30000
    enabled: true
    labels:
      - name: team
        value: commerce
    probes:
      - Atlanta
      - Frankfurt
    alertSensitivity: none
    basicMetricsOnly: false
    settings:
      multihttp:
        entries:
          - request:
              method: POST
              url: https://api.example.com/auth/login
            checks:
              - type: TEXT
                subject: HTTP_STATUS_CODE
                condition: EQUALS
                value: "200"
            variables:
              - type: JSON_PATH
                name: token
                expression: $.token
          - request:
              method: GET
              url: https://api.example.com/orders
              headers:
                - name: Authorization
                  value: Bearer ${token}
            checks:
              - type: TEXT
                subject: HTTP_STATUS_CODE
                condition: EQUALS
                value: "200"

# --- k6 scripted: real logic (auth -> create -> cleanup), asserts response shape ---

- apiVersion: syntheticmonitoring.ext.grafana.app/v1alpha1
  kind: Check
  metadata:
    name: checkout-api-flow-1006
  spec:
    job: checkout-api-flow
    target: checkout-api-flow
    frequency: 300000
    timeout: 90000
    enabled: true
    labels:
      - name: team
        value: commerce
    probes:
      - Atlanta
    alertSensitivity: none
    basicMetricsOnly: false
    settings:
      scripted:
        script: |
          // Generated by synthetic-monitoring-checks (https://github.com/grafana/skills) on 2026-08-01T09:00:00Z
          import http from 'k6/http';
          import { expect } from 'https://jslib.k6.io/k6-testing/0.6.1/index.js';
          import secrets from 'k6/secrets';

          const BASE = 'https://api.example.com';

          export default async function () {
            const password = await secrets.get('checkout-monitor-password');

            const login = http.post(
              `${BASE}/auth/login`,
              JSON.stringify({ user: 'sm-checkout-monitor', password }),
              { headers: { 'Content-Type': 'application/json' } }
            );
            expect(login.status, 'login should return 200').toEqual(200);
            const token = login.json('token');
            expect(token, 'auth token should be present').toBeDefined();

            const order = http.post(`${BASE}/orders`, JSON.stringify({ sku: 'TEST-SKU-1', qty: 1 }), {
              headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
            });
            expect(order.status, 'order should be created').toEqual(201);
            const orderId = order.json('id');
            expect(orderId, 'order id should be returned').toBeDefined();

            const del = http.del(http.url`${BASE}/orders/${orderId}`, null, {
              headers: { Authorization: `Bearer ${token}` },
            });
            expect(del.status, 'test order should be cleaned up').toEqual(204);
          }

# --- k6 browser: real user journeys, selectors/locators live in the script ---

- apiVersion: syntheticmonitoring.ext.grafana.app/v1alpha1
  kind: Check
  metadata:
    name: checkout-browser-flow-1007
  spec:
    job: checkout-browser-flow
    target: https://shop.example.com/cart
    frequency: 300000
    timeout: 60000
    enabled: true
    labels:
      - name: team
        value: commerce
    probes:
      - Atlanta
    alertSensitivity: none
    basicMetricsOnly: false
    settings:
      browser:
        script: |
          // Generated by synthetic-monitoring-checks (https://github.com/grafana/skills) on 2026-08-01T09:05:00Z
          import { browser } from 'k6/browser';
          import { expect } from 'https://jslib.k6.io/k6-testing/0.6.1/index.js';

          export const options = {
            scenarios: { ui: { executor: 'shared-iterations', options: { browser: { type: 'chromium' } } } },
          };

          export default async function () {
            const page = await browser.newPage();
            try {
              await page.goto('https://shop.example.com/cart', { waitUntil: 'load' });
              await page.locator('[data-testid="checkout-submit"]').click();
              await expect(page.getByText('Order confirmed')).toBeVisible();
            } finally {
              await page.close();
            }
          }

- apiVersion: syntheticmonitoring.ext.grafana.app/v1alpha1
  kind: Check
  metadata:
    name: login-journey-browser-1008
  spec:
    job: login-journey-browser
    target: https://shop.example.com/login
    frequency: 600000
    timeout: 120000
    enabled: true
    labels:
      - name: team
        value: commerce
    probes:
      - Frankfurt
    alertSensitivity: none
    basicMetricsOnly: false
    settings:
      browser:
        script: |
          // Generated by synthetic-monitoring-checks (https://github.com/grafana/skills) on 2026-08-01T09:10:00Z
          import { browser } from 'k6/browser';
          import { expect } from 'https://jslib.k6.io/k6-testing/0.6.1/index.js';
          import secrets from 'k6/secrets';

          export const options = {
            scenarios: { ui: { executor: 'shared-iterations', options: { browser: { type: 'chromium' } } } },
          };

          export default async function () {
            const page = await browser.newPage();
            try {
              await page.goto('https://shop.example.com/login');

              const password = await secrets.get('shop-monitor-password');
              await page.getByLabel('Email').fill('sm-monitor@example.com');
              await page.getByLabel('Password').fill(password);
              await page.getByRole('button', { name: 'Sign in' }).click();

              await expect(page.getByRole('heading', { name: 'Your account' })).toBeVisible();

              await page.getByRole('link', { name: 'Orders' }).click();
              await expect(page.getByTestId('order-list')).toBeVisible();
            } finally {
              await page.close();
            }
          }
