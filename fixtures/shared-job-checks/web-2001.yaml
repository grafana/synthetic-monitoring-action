apiVersion: syntheticmonitoring.ext.grafana.app/v1alpha1
kind: Check
metadata:
  name: web-2001
spec:
  alertSensitivity: none
  basicMetricsOnly: true
  channels:
    k6: null
  enabled: true
  folderUid: ""
  frequency: 60000
  job: web
  probes:
  - Seoul
  - Frankfurt
  - NorthCalifornia
  settings:
    http:
      failIfNotSSL: false
      failIfSSL: false
      ipVersion: V4
      method: GET
      noFollowRedirects: false
  target: https://grafana.com
  timeout: 3000
