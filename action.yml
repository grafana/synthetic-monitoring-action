name: "Synthetic Monitoring Check Impact"
description: "Flags Grafana Synthetic Monitoring checks that this PR's diff may break, suggests checks it may be missing, keeps checks in sync with a checks-as-code source, and comments the result on the PR."

inputs:
  mode:
    description: "What to run: `pr-analysis` (impact, suggestions and sync, per their inputs below) or `smoke` (run smoke-check-file / smoke-check-files once against a fresh deploy)."
    required: false
    default: "pr-analysis"
  anthropic-api-key:
    description: "Anthropic API key used to run the impact/suggestion analysis. Not needed for sync-only runs."
    required: false
  grafana-stack-url:
    description: "Grafana Cloud stack URL, e.g. https://myorg.grafana.net"
    required: true
  sm-token:
    description: "Grafana service-account token (glsa_...). Needs write access when sync-enabled is true, read-only otherwise."
    required: true
  github-token:
    description: "Token used to post/update PR comments. Needs `pull-requests: write`."
    required: false
    default: ${{ github.token }}
  gcx-version:
    description: "gcx version to install (e.g. v1.5.0), passed through to grafana/setup-gcx. Pin for reproducibility."
    required: false
    default: "latest"

  # Scoping — applies to every feature below: which checks they read, suggest against,
  # or sync. Narrows a fleet down to "checks only in folder X" (sync's checks-dir),
  # "with label Y" (label-filter), or "hitting domain W" (target-filter).
  label-filter:
    description: "Only consider checks with this label, as key=value (comma-separated for multiple, AND semantics)."
    required: false
  target-filter:
    description: "Only consider checks whose target contains this substring (e.g. a domain)."
    required: false

  check-impact:
    description: "Flag existing SM checks this PR's diff may break."
    required: false
    default: "true"
  fail-on-affected:
    description: "Fail the job if any check is flagged as potentially affected. Only applies when check-impact is true."
    required: false
    default: "false"
  suggest-checks:
    description: "Suggest new SM checks for user-facing flows or endpoints this PR introduces without existing coverage."
    required: false
    default: "false"

  # Checks-as-code sync: no preview mode — when enabled, it applies for real every
  # time it runs. Attach it to whichever workflow trigger should own that (e.g. only
  # on push to main) if you don't want it mutating checks on every PR.
  sync-enabled:
    description: "Sync live checks from a checks-as-code source (checks-dir/checks-file). Creates and updates; see force-delete for deletes."
    required: false
    default: "false"
  checks-dir:
    description: "Directory of one-YAML-file-per-check desired-state definitions. Mutually exclusive with checks-file."
    required: false
  checks-file:
    description: "Single YAML file (array of check docs) of desired-state definitions. Mutually exclusive with checks-dir."
    required: false
  force-delete:
    description: "Also delete live checks that are missing from the source. Default is append-only (create/update only)."
    required: false
    default: "false"

  # Smoke test (mode: smoke): runs each check once via `gcx synthetic-monitoring checks
  # test` — not saved, no schedule — and fails the job unless every probe of every check
  # succeeds. Billed like a scheduled execution on each probe of each check.
  smoke-check-file:
    description: "YAML file with exactly one check to run once. Set this or smoke-check-files for mode: smoke."
    required: false
  smoke-check-files:
    description: "Newline-separated paths or globs (relative to your checkout), one check per file, e.g. `sm-checks/blog-*.yaml`. A pattern that matches nothing fails the run. Set this or smoke-check-file."
    required: false
  smoke-target:
    description: "Override the target of HTTP checks, e.g. a PR preview URL. Other check types run as written."
    required: false
  smoke-cache-bust:
    description: "Added to the target of HTTP checks as a `cb` query param (e.g. github.sha) so probes skip a CDN-cached copy. Other check types run as written."
    required: false
  smoke-body-regexp:
    description: "Regexp the response body must match, appended to an HTTP check's failIfBodyNotMatchesRegexp. Also what smoke-wait-timeout waits for. Other check types run as written."
    required: false
  smoke-wait-timeout:
    description: "Seconds to poll each distinct HTTP target until it responds OK (and matches smoke-body-regexp, when set) before running any check. 0 skips the wait."
    required: false
    default: "0"
  smoke-wait-interval:
    description: "Seconds between polls while waiting."
    required: false
    default: "15"
  smoke-logs-datasource-uid:
    description: "Loki datasource UID gcx polls for the ad-hoc results, if it can't find one itself."
    required: false
  smoke-comment:
    description: "Post the smoke report as a sticky PR comment on pull_request events. Set to `false` to post your own, using the smoke-report output."
    required: false
    default: "true"

outputs:
  affected-count:
    description: "Number of checks flagged as potentially affected (check-impact)."
    value: ${{ steps.analyze.outputs.affected-count }}
  total-count:
    description: "Total number of checks evaluated (check-impact)."
    value: ${{ steps.analyze.outputs.total-count }}
  smoke-result:
    description: "Path to the raw `checks test` JSON of the first failing check, or of the first check if none failed (mode: smoke). Unset if nothing ran."
    value: ${{ steps.smoke.outputs.smoke-result }}
  smoke-report:
    description: "Path to the markdown smoke report (mode: smoke). Unset if the run failed before producing one."
    value: ${{ steps.smoke.outputs.smoke-report }}
  adhoc-id:
    description: "Ad-hoc execution ID of the check smoke-result describes, for finding its logs (mode: smoke)."
    value: ${{ steps.smoke.outputs.adhoc-id }}
  failed-probes:
    description: "Comma-separated <check>/<probe>=<status> for every probe that didn't succeed (mode: smoke)."
    value: ${{ steps.smoke.outputs.failed-probes }}

runs:
  using: "composite"
  steps:
    # Needs the base branch present locally for `git diff origin/<base>...HEAD` in
    # tools.ts. Only meaningful (and only valid — base.ref is empty otherwise) on a
    # pull_request event; sync-enabled runs regardless of event (no preview mode).
    - name: Fetch PR base branch
      if: inputs.mode == 'pr-analysis' && github.event_name == 'pull_request'
      shell: bash
      env:
        BASE_REF: ${{ github.event.pull_request.base.ref }}
      run: git fetch --depth=1 origin "$BASE_REF"

    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: "24"

    - name: Install gcx
      uses: grafana/setup-gcx@bdf13767f415608f4c1f1940251ce4c5d34dd36b # v1
      with:
        version: ${{ inputs.gcx-version }}
        github-token: ${{ inputs.github-token }}

    - name: Install action dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci

    - name: Run analysis
      id: analyze
      if: inputs.mode == 'pr-analysis' && (inputs.check-impact == 'true' || inputs.suggest-checks == 'true')
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        GRAFANA_SERVER: ${{ inputs.grafana-stack-url }}
        GRAFANA_TOKEN: ${{ inputs.sm-token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        SM_ACTION_BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        SM_ACTION_LABEL_FILTER: ${{ inputs.label-filter }}
        SM_ACTION_TARGET_FILTER: ${{ inputs.target-filter }}
        SM_ACTION_CHECK_IMPACT: ${{ inputs.check-impact }}
        SM_ACTION_FAIL_ON_AFFECTED: ${{ inputs.fail-on-affected }}
        SM_ACTION_SUGGEST_CHECKS: ${{ inputs.suggest-checks }}
      run: npx tsx src/run.ts | tee "$RUNNER_TEMP/sm-action-report.md"

    - name: Post analysis comment
      if: inputs.mode == 'pr-analysis' && (inputs.check-impact == 'true' || inputs.suggest-checks == 'true')
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: npx tsx src/post-comment.ts "$RUNNER_TEMP/sm-action-report.md"

    - name: Run sync
      if: inputs.mode == 'pr-analysis' && inputs.sync-enabled == 'true'
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        GRAFANA_SERVER: ${{ inputs.grafana-stack-url }}
        GRAFANA_TOKEN: ${{ inputs.sm-token }}
        SM_ACTION_DESIRED_CHECKS_DIR: ${{ inputs.checks-dir }}
        SM_ACTION_DESIRED_CHECKS_FILE: ${{ inputs.checks-file }}
        SM_ACTION_LABEL_FILTER: ${{ inputs.label-filter }}
        SM_ACTION_TARGET_FILTER: ${{ inputs.target-filter }}
        SM_ACTION_FORCE_DELETE: ${{ inputs.force-delete }}
      run: npx tsx src/sync.ts | tee "$RUNNER_TEMP/sm-action-sync-report.md"

    - name: Post sync comment
      if: inputs.mode == 'pr-analysis' && inputs.sync-enabled == 'true'
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: npx tsx src/post-comment.ts "$RUNNER_TEMP/sm-action-sync-report.md" "<!-- sm-action-sync -->"

    - name: Run smoke test
      id: smoke
      if: inputs.mode == 'smoke'
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        GRAFANA_SERVER: ${{ inputs.grafana-stack-url }}
        GRAFANA_TOKEN: ${{ inputs.sm-token }}
        # Check paths are relative to the caller's checkout, not the action's directory.
        SM_ACTION_WORKSPACE: ${{ github.workspace }}
        SM_ACTION_SMOKE_CHECK_FILE: ${{ inputs.smoke-check-file }}
        SM_ACTION_SMOKE_CHECK_FILES: ${{ inputs.smoke-check-files }}
        SM_ACTION_SMOKE_TARGET: ${{ inputs.smoke-target }}
        SM_ACTION_SMOKE_CACHE_BUST: ${{ inputs.smoke-cache-bust }}
        SM_ACTION_SMOKE_BODY_REGEXP: ${{ inputs.smoke-body-regexp }}
        SM_ACTION_SMOKE_WAIT_TIMEOUT: ${{ inputs.smoke-wait-timeout }}
        SM_ACTION_SMOKE_WAIT_INTERVAL: ${{ inputs.smoke-wait-interval }}
        SM_ACTION_SMOKE_LOGS_DATASOURCE_UID: ${{ inputs.smoke-logs-datasource-uid }}
        SM_ACTION_SMOKE_REPORT_FILE: ${{ runner.temp }}/sm-action-smoke-report.md
      run: npx tsx src/smoke-run.ts

    # Runs on failure too — a failed smoke run is exactly what the PR needs to see.
    # Only on pull_request: on a push there's no PR of its own to comment on.
    - name: Post smoke comment
      if: always() && inputs.mode == 'smoke' && inputs.smoke-comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        report="$RUNNER_TEMP/sm-action-smoke-report.md"
        if [ ! -s "$report" ]; then
          echo "No smoke report to post."
          exit 0
        fi
        npx tsx src/post-comment.ts "$report" "<!-- sm-action-smoke -->"
